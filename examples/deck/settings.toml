# refract deck settings. Precedence: CLI flag > settings.toml > built-in default.

[slide]
width = 1600
height = 900

[theme]
background      = "#FF141A2E"   # slide background
title_color     = "#FFFFFFFF"   # slide titles
body_color      = "#FFE6EEF6"   # body text / bullets
code_background  = "#FF1E1E1E"   # fenced code block background
code_foreground  = "#FFD4D4D4"   # fenced code text

[code]
background = "#FF1E1E1E"        # code panel background
foreground = "#FFD4D4D4"        # default code text
font_size  = 28
corner_radius = 18              # round the code panel corners (0 = square)

# Syntax-highlight colours by token type (any subset; the rest use defaults).
[code.syntax]
keyword    = "#FFC586C0"        # fun, val, class, if, ...
type       = "#FF4EC9B0"        # Capitalized type names
string     = "#FFCE9178"
number     = "#FFB5CEA8"
comment    = "#FF6A9955"
key        = "#FF9CDCFE"        # JSON property names
literal    = "#FF569CD6"        # true / false / null

[image]
corner_radius = 28              # round embedded image corners (0 = square)

[graph]                         # graphviz node/edge colours
node_fill   = "#FF1B2A3D"
node_stroke = "#FF4FC3F7"
node_text   = "#FFE6EEF6"
edge        = "#FF89A7C2"

# Animated background shader (SkSL). Applies to all slides; add [shader.title] etc.
# for per-slide-type overrides. Comment this out for a plain solid background.
[shader]
file = "shader.sksl"

# Overlay shader shown only during a transition (gets an `iProgress` 0→1 uniform):
# light dots that rise from the bottom and fade out quickly.
[shader.transition]
file = "transition.sksl"

[transition]
enabled = false                 # set true to emit StateLayout crossfades (like --transitions)
